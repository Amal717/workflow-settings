# ============================================================
# TMUX CONFIG — minimal, ergonomic, catppuccin mocha
#
# Alt  = things you do constantly (navigate, split, switch)
# Ctrl+Space = things you do occasionally (new, kill, reload)
# ============================================================


# ── PREFIX ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ── GENERAL ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# Fix: pass through true 24-bit RGB colors so PS1 colors match outside tmux
set -ag terminal-overrides ",*:RGB"

set -g escape-time 0
set -g repeat-time 0
set -g history-limit 10000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on


# ── ALT BINDINGS (no prefix, things you do constantly) ──────

# Splits
bind -n M-\\ split-window -h -c "#{pane_current_path}"  # vertical
bind -n M--  split-window -v -c "#{pane_current_path}"  # horizontal

# Move between panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Switch windows
bind -n M-n next-window
bind -n M-p previous-window


# ── PREFIX BINDINGS (things you do occasionally) ─────────────

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# New window in same directory
bind c new-window -c "#{pane_current_path}"

# Kill pane / window
bind x kill-pane
bind q kill-window

# Resize panes
bind Left  resize-pane -L 5
bind Right resize-pane -R 5
bind Down  resize-pane -D 5
bind Up    resize-pane -U 5

# Copy mode
bind Enter copy-mode


# ── COPY MODE (vim keys) ─────────────────────────────────────
set -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel

# ── MOUSE SELECTION & RESIZE ─────────────────────────────────
# Drag inside pane  → select text (no Shift needed)
# Drag pane border  → resize pane
bind -n MouseDrag1Pane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -M"
bind -n MouseDragEnd1Pane send-keys -M
unbind -T copy-mode-vi MouseDragEnd1Pane  # keep selection alive after drag


# ── RIGHT-CLICK CONTEXT MENU ─────────────────────────────────
# -O keeps menu open after releasing mouse (tmux 3.4+)
# Colors match PS1: neon green, violet, red
bind -n MouseDown3Pane display-menu -O \
  -T "#[fg=#f38ba8,bold,align=centre] Menu " \
  -x M -y M \
  "#[fg=#32ff78]  Vertical split"    v "split-window -h -c '#{pane_current_path}'" \
  "#[fg=#32ff78]  Horizontal split"  s "split-window -v -c '#{pane_current_path}'" \
  ""                                 "" "" \
  "#[fg=#32ff78]  New window"        n "new-window -c '#{pane_current_path}'"      \
  "#[fg=#32ff78]  Next window"       l "next-window"                                \
  "#[fg=#32ff78]  Prev window"       h "previous-window"                            \
  ""                                 "" "" \
  "#[fg=#32ff78]  Copy / scroll"     e "copy-mode"                                  \
  "#[fg=#32ff78]  Zoom pane"         z "resize-pane -Z"                             \
  ""                                 "" "" \
  "#[fg=#f38ba8]  Kill pane"         x "kill-pane"                                  \
  "#[fg=#f38ba8]  Kill window"       q "kill-window"                                \
  ""                                 "" "" \
  "#[fg=#bd93f9]  Reload config"     r "source-file ~/.tmux.conf \; display 'Reloaded'"


# ── CATPPUCCIN MOCHA COLORS ──────────────────────────────────
thm_fg="#cdd6f4"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_blue="#89b4fa"
thm_black4="#585b70"


# ── STATUS BAR ──────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=${thm_black},fg=${thm_fg}"

# Left: session name
set -g status-left "#[fg=${thm_black},bg=${thm_blue},bold] #S #[fg=${thm_blue},bg=${thm_black}]"
set -g status-left-length 30

# Right: time and date
set -g status-right "#[fg=${thm_gray},bg=${thm_black}]#[fg=${thm_fg},bg=${thm_gray}] %H:%M #[fg=${thm_blue},bg=${thm_gray}]#[fg=${thm_black},bg=${thm_blue},bold] %d %b "
set -g status-right-length 40

# Window tabs
set -g window-status-format         "#[fg=${thm_black4},bg=${thm_black}] #I #W "
set -g window-status-current-format "#[fg=${thm_black},bg=${thm_magenta},bold] #I #W "
set -g window-status-separator      ""

# Pane borders
set -g pane-border-style        "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Message bar
set -g message-style         "bg=${thm_gray},fg=${thm_fg}"
set -g message-command-style "bg=${thm_gray},fg=${thm_fg}"

# Copy mode highlight
set -g mode-style "bg=${thm_magenta},fg=${thm_black}"

# ============================================================
# KEY REFERENCE:
#
# ALT (no prefix needed):
#   Alt + \       = vertical split (side by side)
#   Alt + -       = horizontal split (top/bottom)
#   Alt + h/j/k/l = move between panes
#   Alt + n/p     = next/previous window
#
# CTRL+SPACE (prefix):
#   prefix + c     = new window
#   prefix + x     = kill pane
#   prefix + q     = kill window
#   prefix + r     = reload config
#   prefix + Enter = copy/scroll mode
#   prefix + arrows= resize panes
#
# MOUSE:
#   Right-click    = context menu (dismiss with Esc or q)
#   Drag pane edge = resize pane
#   Drag in pane   = select text
#
# UNCHANGED:
#   Ctrl + l       = clear terminal
# ============================================================
